<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idlezada — Builds</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <h1 class="brand">Idlezada <small>build generator</small></h1>
  <div class="navtabs" id="navtabs">
    <div class="navtab on" data-view="builds">Builds</div>
    <div class="navtab" data-view="sim">Simulator</div>
    <div class="navtab" data-view="stamina">Stamina</div>
  </div>
</div>

<!-- ===== BUILDS ===== -->
<section class="view on" id="view-builds">
  <div class="wrap">
    <p class="lead">Set the level and pick an objective — the build is assembled automatically and the share code is ready to copy. Fine-tune it by clicking "Open in simulator".</p>
    <div class="slots" id="slots"></div>
  </div>
</section>

<!-- ===== SIMULATOR ===== -->
<section class="view" id="view-sim">
  <div class="iframe-wrap"><iframe id="simFrame" title="Build Simulator"></iframe></div>
</section>

<!-- ===== STAMINA ===== -->
<section class="view" id="view-stamina">
  <div class="iframe-wrap"><iframe id="staminaFrame" title="Stamina Calculator"></iframe></div>
</section>

<script src="trees.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
