<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>idlezada — Builds</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <h1 class="brand">idlezada <small>gerador de builds · Baiak Idle</small></h1>
  <div class="navtabs" id="navtabs">
    <div class="navtab on" data-view="builds">Builds</div>
    <div class="navtab" data-view="sim">Simulador</div>
    <div class="navtab" data-view="stamina">Stamina</div>
  </div>
</div>

<!-- ===== BUILDS ===== -->
<section class="view on" id="view-builds">
  <div class="wrap">
    <p class="lead">Informe o level e escolha o objetivo — a build é montada sozinha e o código sai pronto pra colar no Baiak Idle. Refine clicando em "Abrir no simulador".</p>
    <div class="slots" id="slots"></div>
  </div>
</section>

<!-- ===== SIMULADOR ===== -->
<section class="view" id="view-sim">
  <div class="iframe-wrap"><iframe id="simFrame" title="Simulador de Build"></iframe></div>
</section>

<!-- ===== STAMINA ===== -->
<section class="view" id="view-stamina">
  <div class="iframe-wrap"><iframe id="staminaFrame" title="Calculadora de Stamina"></iframe></div>
</section>

<script src="trees.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
