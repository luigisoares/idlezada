<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Simulator — Idlezada</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* mesmo tema do site (styles.css V3): verde-escuro + dourado, Manrope */
:root{
  --bg:#0e1311; --panel:#151c19; --panel2:#1b2420; --line:#25312b; --line2:#34453c; --sunken:#0a0f0d;
  --txt:#e4ece7; --dim:#95a89d; --dimmer:#67796f; --gold:#e8c56a; --gold-hi:#f3d68a; --acc:#6fdc8c;
  --f-display:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1{font:800 22px/1 var(--f-display);letter-spacing:-.01em;margin:0;color:var(--txt)}
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{color:#11160f}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.bar label{color:var(--dim);font-size:13px}
input[type=number],input[type=text]{background:var(--sunken);border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:8px 10px;font:inherit}
input:focus{outline:0;border-color:rgba(232,197,106,.36);box-shadow:0 0 0 3px rgba(232,197,106,.13)}
input[type=number]{width:96px}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.sw i{width:34px;height:19px;border-radius:999px;background:var(--line2);position:relative;transition:.15s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--bg);transition:.15s}
.sw.on i{background:var(--gold)}
.sw.on i::after{transform:translateX(15px)}
.pill{padding:7px 15px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  font-weight:600;font-size:13px;white-space:nowrap}
.pill.gold{color:var(--gold-hi);border-color:rgba(232,197,106,.36);background:rgba(232,197,106,.1)}
.pill.over{color:#ff9b8b;border-color:rgba(255,122,104,.4)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;
  padding:7px 15px;font:600 13px/1 inherit;cursor:pointer;transition:.15s}
button:hover{border-color:var(--line2)}
.main{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-top:16px;align-items:start}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.treebox{position:relative;overflow:hidden;border-radius:16px;background:
  radial-gradient(circle at 50% 40%,#16211b 0%,#0a0f0d 72%);border:1px solid var(--line)}
.zoom{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
.zoom button{width:32px;height:32px;padding:0;border-radius:9px;font-size:15px}
svg{display:block;width:100%;height:640px;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
.edge{stroke:#26352d;stroke-width:2.5}
.edge.on{stroke:#b79a4e}
.nd{cursor:pointer}
.nd circle.ring{fill:#111815;stroke:#2f4137;stroke-width:2.5}
.nd.on circle.ring{fill:#221f14}
.nd.can circle.ring{stroke:#4a6455}
.nd.max circle.ring{stroke-width:3}
.nd text{font:600 9px/1 var(--f-body);fill:#8fa398;text-anchor:middle;pointer-events:none;user-select:none}
.nd.on text{fill:#f0e6c8}
.nd .ic{font-size:15px;text-anchor:middle;pointer-events:none;user-select:none}
.side{display:flex;flex-direction:column;gap:16px}
.side h2{font:800 15px/1 var(--f-display);color:var(--txt);margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.pad{padding:16px 18px}
.stats{max-height:400px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.stat{background:var(--panel2);border-left:3px solid var(--acc);
  border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600}
.stat.sp{border-left-color:var(--gold);background:rgba(232,197,106,.08);color:#f0dda6;font-weight:500;font-size:12.5px;line-height:1.4}
.empty{color:var(--dim);font-size:13px;font-style:italic}
.note{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.5}
.codebox{display:flex;gap:8px;margin-top:8px}
.codebox input{flex:1;font-family:var(--f-mono);font-size:12px;color:var(--gold-hi)}
#tip{position:fixed;z-index:50;pointer-events:none;max-width:290px;background:#0a0f0d;
  border:1px solid #34453c;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.5;
  box-shadow:0 10px 30px #000a;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip b{color:var(--gold)}
#tip .k{color:var(--dim)}
#tip .g{color:var(--acc)}
#tip .r{color:#ff9b8b}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;padding:0 18px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #4a6455;display:inline-block}
.dot.n{border-color:var(--gold);width:13px;height:13px}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <div class="top">
    <h1>Build Simulator</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="bar">
    <label for="lv">Level</label>
    <input type="number" id="lv" min="1" max="9999999" value="900">
    <div class="sw" id="full"><i></i><span>Full unlocked</span></div>
    <div class="pill gold" id="budget">&#10022; unlimited</div>
    <div class="pill" id="spent">0 spent</div>
    <button id="reset">Reset</button>
    <div class="sw on" id="types" style="margin-left:auto"><i></i><span>Types</span></div>
  </div>
  <div class="legend">
    <span><i class="dot"></i> small &mdash; cost scales per rank</span>
    <span><i class="dot n"></i> notable &mdash; single rank, fixed cost</span>
    <span>click = +1 &nbsp;&middot;&nbsp; right-click / shift = &minus;1</span>
  </div>
</div>

<div class="main">
  <div class="treebox">
    <div class="zoom">
      <button id="zo">&minus;</button><button id="zf">&#9974;</button><button id="zi">+</button>
    </div>
    <svg id="svg"><g id="cam"><g id="edges"></g><g id="nodes"></g></g></svg>
  </div>

  <div class="side">
    <div class="card pad">
      <h2>Unlocked attributes</h2>
      <div class="sub" id="cnt">0 nodes &middot; 0 points invested</div>
      <div class="stats" id="stats"></div>
      <div class="note" id="fullnote"></div>
    </div>
    <div class="card pad">
      <h2>Build code</h2>
      <div class="codebox">
        <input type="text" id="code" readonly>
        <button id="copy">Copy</button>
      </div>
      <div class="codebox">
        <input type="text" id="load" placeholder="BT1-D850-...">
        <button id="dold">Load</button>
      </div>
      <div class="note">Compatible share-code format &mdash; paste a code here and copy it back out.</div>
    </div>
  </div>
</div>
</div>

<div id="tip"></div>

<script src="trees.js?v=20"></script>
<script src="engine.js?v=20"></script>
<script>
const TREES = window.TREES;

const VOCS=['knight','paladin','sorcerer','druid','monk'];
const VNAME={knight:'Knight',paladin:'Paladin',sorcerer:'Sorcerer',druid:'Druid',monk:'Monk'};
const VCOL={knight:'#ff7a68',paladin:'#ffd46b',sorcerer:'#b98cff',druid:'#76d69a',monk:'#6fd3ee'};
const VLET={knight:'K',paladin:'P',sorcerer:'S',druid:'D',monk:'M'};
const LETV={K:'knight',P:'paladin',S:'sorcerer',D:'druid',M:'monk'};
const EL={physical:'physical',energy:'energy',earth:'earth',fire:'fire',ice:'ice',holy:'holy',death:'death'};

const SL={
  atkPct:v=>`+${v}% attack`, defFlat:v=>`+${v} def`, armorFlat:v=>`+${v} armor`,
  critChance:v=>`+${v}% crit chance`, critDmg:v=>`+${v}% crit damage`,
  lifeLeech:v=>`+${v}% life leech`, manaLeech:v=>`+${v}% mana leech`,
  hpPct:v=>`+${v}% HP`, manaPct:v=>`+${v}% mana`, expPct:v=>`+${v}% exp`, lootPct:v=>`+${v}% loot`,
  spellDmgPct:v=>`+${v}% spell damage`, attackSpeedPct:v=>`+${v}% attack speed`,
  spellHealPct:v=>`+${v}% spell healing`, hpRegenPct:v=>`+${v}% HP regen`,
  mpRegenPct:v=>`+${v}% mana regen`
};
const SORD=['critChance','critDmg','lifeLeech','manaLeech','atkPct','attackSpeedPct','armorFlat',
  'defFlat','hpPct','manaPct','expPct','lootPct','spellDmgPct','spellHealPct','hpRegenPct','mpRegenPct'];
const ELORD=['physical','energy','earth','fire','ice','holy','death'];

const SPL={
  dodge:v=>`${v}% chance to take 0 damage`,
  gift_of_life:v=>`Gift of Life: survives a lethal hit (cd ${v}s)`,
  momentum:v=>`${v}% chance on auto-attack to cut 2s off all spell cooldowns`,
  execute:v=>`+${v}% damage vs monsters below 25% HP`,
  element_pierce:v=>`ignores ${v}% of the monster's elemental resistance`,
  battle_instinct:v=>`+${v} def per monster in melee range`,
  chain:v=>`auto-attack jumps to +${v} nearby monster(s) (60% damage)`,
  slash:v=>`cleaves monsters adjacent to the target for ${v}% of the hit`,
  precision:v=>`${v}% chance of a full second attack`,
  tactics:v=>`+${v} tactics: aim, positioning and reaction (level 3 unlocks infinite kiting)`,
  avatar:v=>`${v}% chance, per hit or spell that lands, to enter Avatar form for 15s`
};

const CATC={def:'#7fb7ff',heal:'#8ff0b8',crit:'#ffb35c',energy:'#c78cff',speed:'#6fe6dc',
  leech:'#ff7f9e',regen:'#9fe37a',hp:'#ff8f7a',mana:'#6fa8ff',exp:'#ffd76a',loot:'#e8c56a',atk:'#e0a76a'};
function cat(p){
  if(!p) return 'atk';
  if(p.absorbPct) return 'def';
  if((p.spellHealPct||0)>0) return 'heal';
  if((p.critChance||0)>0||(p.critDmg||0)>0) return 'crit';
  if((p.spellDmgPct||0)>0) return 'energy';
  if((p.attackSpeedPct||0)>0) return 'speed';
  if((p.lifeLeech||0)>0||(p.manaLeech||0)>0) return 'leech';
  if((p.hpRegenPct||0)>0||(p.mpRegenPct||0)>0) return 'regen';
  if((p.hpPct||0)>0) return 'hp';
  if((p.manaPct||0)>0) return 'mana';
  if((p.expPct||0)>0) return 'exp';
  if((p.lootPct||0)>0) return 'loot';
  return 'atk';
}

/* ---------- engine ---------- */
const { nd, nextCost, totalCost, spent, fullCost, reach, allocCount, valid,
  connected, canAlloc, canDealloc, aggregate, sortedNodes, encode, decode } = window.Engine;
const fmt=x=>{const r=Math.round(x*100)/100; return String(r);};

/* ---------- state ---------- */
let VOC='knight', RANKS={}, LEVEL=900, FULL=true, TYPES=true;
const budget=()=>FULL?Number.MAX_SAFE_INTEGER:LEVEL;

/* ---------- layout ---------- */
const CW=88,RH=78,PAD=60;
const px=n=>PAD+n.col*CW, py=n=>PAD+n.tier*RH;
const $=id=>document.getElementById(id);
let cam={x:0,y:0,k:1};

function buildTabs(){
  $('tabs').innerHTML='';
  for(const v of VOCS){
    const b=document.createElement('div');
    b.className='tab'+(v===VOC?' on':''); b.textContent=VNAME[v];
    if(v===VOC){b.style.background=VCOL[v];b.style.borderColor=VCOL[v];}
    b.onclick=()=>{ VOC=v; RANKS={}; fit(); render(); };
    $('tabs').appendChild(b);
  }
}
function drawTree(){
  const E=$('edges'),N=$('nodes'); E.innerHTML=''; N.innerHTML='';
  const seen=new Set();
  for(const n of TREES[VOC]) for(const r of (n.requires||[])){
    const key=n.id<r?n.id+'|'+r:r+'|'+n.id; if(seen.has(key)) continue; seen.add(key);
    const a=nd(VOC,r); if(!a) continue;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',px(n));l.setAttribute('y1',py(n));
    l.setAttribute('x2',px(a));l.setAttribute('y2',py(a));
    l.setAttribute('class','edge'); l.dataset.a=n.id; l.dataset.b=r;
    E.appendChild(l);
  }
  for(const n of TREES[VOC]){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','nd'); g.setAttribute('transform',`translate(${px(n)},${py(n)})`);
    g.dataset.id=n.id;
    const rr=n.kind==='notable'?24:17;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',rr); c.setAttribute('class','ring'); g.appendChild(c);
    if(n.kind==='notable'){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('class','ic'); t.setAttribute('y',5); t.textContent='✦'; g.appendChild(t);
    }
    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('y',rr+13); g.appendChild(lbl);
    g.addEventListener('click',e=>{ e.preventDefault(); if(e.shiftKey) dealloc(n.id); else alloc(n.id); });
    g.addEventListener('contextmenu',e=>{ e.preventDefault(); dealloc(n.id); });
    g.addEventListener('mousemove',e=>showTip(e,n));
    g.addEventListener('mouseleave',hideTip);
    N.appendChild(g);
  }
}
function alloc(id){ if(canAlloc(VOC,RANKS,id,budget())){ RANKS[id]=(RANKS[id]||0)+1; render(); } }
function dealloc(id){
  if(!canDealloc(VOC,RANKS,id)) return;
  RANKS[id]=(RANKS[id]||0)-1; if(RANKS[id]<=0) delete RANKS[id]; render();
}

function render(){
  buildTabs();
  const bud=budget(), sp=spent(VOC,RANKS);
  for(const g of $('nodes').children){
    const n=nd(VOC,g.dataset.id), r=RANKS[n.id]||0;
    const on=r>0, mx=r>=n.maxRank, can=canAlloc(VOC,RANKS,n.id,bud);
    g.setAttribute('class','nd'+(on?' on':'')+(can?' can':'')+(mx?' max':''));
    const ring=g.querySelector('.ring');
    const col = n.kind==='notable' ? '#e8c56a' : (TYPES?CATC[cat(n.per)]:VCOL[VOC]);
    ring.setAttribute('stroke', on?col:(can?'#4a6455':'#2f4137'));
    ring.setAttribute('fill', on?'#221f14':'#111815');
    ring.style.filter = on?`drop-shadow(0 0 6px ${col}aa)`:'none';
    g.style.opacity = (on||can)?1:.55;
    const ic=g.querySelector('.ic'); if(ic) ic.setAttribute('fill',on?col:'#5a6b61');
    g.querySelector('text:last-child').textContent=`${r}/${n.maxRank}`;
  }
  for(const l of $('edges').children){
    const on=(RANKS[l.dataset.a]||0)>0&&(RANKS[l.dataset.b]||0)>0;
    l.setAttribute('class','edge'+(on?' on':''));
    if(on) l.setAttribute('stroke',VCOL[VOC]+'88');
    else l.removeAttribute('stroke');
  }
  $('spent').textContent=`${sp.toLocaleString('en-US')} spent`;
  $('spent').className='pill'+(!FULL&&sp>bud?' over':'');
  $('budget').textContent=FULL?'✦ unlimited':`${LEVEL.toLocaleString('en-US')} points`;
  $('full').className='sw'+(FULL?' on':'');
  $('types').className='sw'+(TYPES?' on':'');
  $('lv').disabled=FULL; $('lv').style.opacity=FULL?.45:1;
  $('cnt').textContent=`${allocCount(VOC,RANKS)} nodes · ${sp.toLocaleString('en-US')} points invested`;
  $('fullnote').textContent=`Fully maxing this vocation's tree: ~${fullCost(VOC).toLocaleString('en-US')} points (level ${fullCost(VOC).toLocaleString('en-US')}).`;
  renderStats();
  const code=encode(VOC,RANKS,FULL?null:LEVEL);
  $('code').value=code;
  history.replaceState(null,'','#'+code);
}
function renderStats(){
  const {bonus,absorb,elem,spec}=aggregate(VOC,RANKS);
  const box=$('stats'); box.innerHTML='';
  const add=(txt,sp)=>{const d=document.createElement('div');d.className='stat'+(sp?' sp':'');d.textContent=txt;box.appendChild(d);};
  for(const k of SORD) if(bonus[k]) add((SL[k]||(v=>`+${v} ${k}`))(fmt(bonus[k])));
  for(const k in bonus) if(!SORD.includes(k)&&bonus[k]) add((SL[k]||(v=>`+${v} ${k}`))(fmt(bonus[k])));
  for(const e of ELORD) if(absorb[e]) add(`+${fmt(absorb[e])}% ${EL[e]} protection`);
  if(elem.elementDmgPct) for(const e of ELORD) if(elem.elementDmgPct[e]) add(`+${fmt(elem.elementDmgPct[e])}% ${EL[e]} damage`);
  for(const k in spec) if(spec[k]) add((SPL[k]||(v=>`${k}: ${v}`))(fmt(spec[k])),true);
  if(!box.children.length){const d=document.createElement('div');d.className='empty';
    d.textContent='No nodes allocated yet.';box.appendChild(d);}
}

/* ---------- tooltip ---------- */
function showTip(e,n){
  const t=$('tip'), r=RANKS[n.id]||0;
  const lines=[];
  lines.push(`<b>${n.name}</b> <span class="k">&middot; ${n.kind==='notable'?'notable':'small'} &middot; tier ${n.tier}</span>`);
  lines.push(`<span class="k">Rank</span> ${r}/${n.maxRank}`);
  if(r<n.maxRank){
    const c=nextCost(n,r);
    const ok=canAlloc(VOC,RANKS,n.id,budget());
    const why = ok?'' : (!connected(VOC,RANKS,n.id)?' <span class="r">(not connected)</span>':' <span class="r">(not enough points)</span>');
    lines.push(`<span class="k">Next point</span> <span class="${ok?'g':'r'}">${c}</span>${why}`);
  }
  if(r>0) lines.push(`<span class="k">Invested here</span> ${totalCost(n,r)}`);
  lines.push(`<span class="k">Max (${n.maxRank})</span> ${totalCost(n,n.maxRank)}`);
  if(n.per){
    const ps=[];
    for(const k in n.per){
      const v=n.per[k];
      if(typeof v==='object'){
        for(const el in v) ps.push(k==='absorbPct'?`+${v[el]}% prot ${EL[el]}`:`+${v[el]}% dano ${EL[el]}`);
      } else ps.push((SL[k]||(x=>`+${x} ${k}`))(v));
    }
    lines.push(`<span class="k">Per rank:</span> ${ps.join(', ')}`);
  }
  if(n.desc) lines.push(`<span style="color:#f0dda6">${n.desc}</span>`);
  t.innerHTML=lines.join('<br>');
  t.classList.add('on');
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  const b=t.getBoundingClientRect();
  if(x+b.width>innerWidth-8) x=e.clientX-b.width-pad;
  if(y+b.height>innerHeight-8) y=e.clientY-b.height-pad;
  t.style.left=x+'px'; t.style.top=y+'px';
}
const hideTip=()=>$('tip').classList.remove('on');

/* ---------- camera ---------- */
function applyCam(){ $('cam').setAttribute('transform',`translate(${cam.x},${cam.y}) scale(${cam.k})`); }
function fit(){
  drawTree();
  const ns=TREES[VOC];
  const xs=ns.map(px), ys=ns.map(py);
  const w=Math.max(...xs)+PAD, h=Math.max(...ys)+PAD;
  const sv=$('svg').getBoundingClientRect();
  const k=Math.min(sv.width/w, sv.height/h)*0.95;
  cam.k=k; cam.x=(sv.width-w*k)/2; cam.y=(sv.height-h*k)/2;
  applyCam();
}
(function(){
  const sv=$('svg'); let drag=null;
  sv.addEventListener('pointerdown',e=>{ if(e.target.closest('.nd')) return;
    drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; sv.classList.add('drag'); sv.setPointerCapture(e.pointerId); });
  sv.addEventListener('pointermove',e=>{ if(!drag) return;
    cam.x=drag.cx+(e.clientX-drag.x); cam.y=drag.cy+(e.clientY-drag.y); applyCam(); });
  sv.addEventListener('pointerup',e=>{ drag=null; sv.classList.remove('drag'); });
  sv.addEventListener('wheel',e=>{ e.preventDefault();
    const r=sv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const f=e.deltaY<0?1.12:1/1.12, nk=Math.min(3,Math.max(.3,cam.k*f));
    cam.x=mx-(mx-cam.x)*(nk/cam.k); cam.y=my-(my-cam.y)*(nk/cam.k); cam.k=nk; applyCam(); },{passive:false});
  const z=f=>{ const r=sv.getBoundingClientRect(), mx=r.width/2, my=r.height/2;
    const nk=Math.min(3,Math.max(.3,cam.k*f));
    cam.x=mx-(mx-cam.x)*(nk/cam.k); cam.y=my-(my-cam.y)*(nk/cam.k); cam.k=nk; applyCam(); };
  $('zi').onclick=()=>z(1.2); $('zo').onclick=()=>z(1/1.2); $('zf').onclick=fit;
})();

/* ---------- wiring ---------- */
$('full').onclick=()=>{ FULL=!FULL; render(); };
$('types').onclick=()=>{ TYPES=!TYPES; render(); };
$('lv').oninput=e=>{ LEVEL=Math.max(1,parseInt(e.target.value||'1',10)); render(); };
$('reset').onclick=()=>{ RANKS={}; render(); };
$('copy').onclick=()=>{ navigator.clipboard.writeText($('code').value);
  $('copy').textContent='Copiado!'; setTimeout(()=>$('copy').textContent='Copiar',1200); };
function loadCode(c){
  const d=decode(c); if(!d){ alert('Invalid code. Format: BT1-D850-A5F...'); return; }
  VOC=d.voc; RANKS=d.ranks;
  if(d.level==null) FULL=true; else { FULL=false; LEVEL=d.level; $('lv').value=d.level; }
  fit(); render();
}
$('dold').onclick=()=>loadCode($('load').value);
$('load').onkeydown=e=>{ if(e.key==='Enter') loadCode($('load').value); };
addEventListener('resize',()=>fit());

/* O "Open in simulator" da aba Builds navega este iframe trocando SO o fragmento
   (simuladorbuild.html#CODIGO). Trocar o fragmento nao recarrega o documento, entao
   ler o hash uma vez no load fazia a build certa aparecer somente no primeiro clique --
   nos seguintes o hash mudava e nada reagia, e o simulador ficava mostrando a vocacao e
   o level da build anterior. Escutar hashchange resolve na raiz, e de graca faz editar
   o hash na mao funcionar tambem. */
function loadFromHash(){
  const c = location.hash.slice(1);
  if(c.length > 5 && decode(c)){ loadCode(c); return true; }
  return false;
}
addEventListener('hashchange', loadFromHash);
if(!loadFromHash()){ fit(); render(); }
</script>
