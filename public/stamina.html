<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamina Calculator — Idlezada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* mesmo tema do site (styles.css V3): verde-escuro + dourado, Manrope */
  :root{
    --bg:#0e1311; --panel:#151c19; --panel-2:#1b2420; --line:#25312b; --sunken:#0a0f0d;
    --ink:#e4ece7; --muted:#95a89d;
    --hunt:#e0a76a; --train:#6fdc8c; --night:#8aa0e0; --warn:#e8c56a; --danger:#ff7a68;
    --f-display:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink); font:15px/1.55 var(--f-body);
    -webkit-font-smoothing:antialiased; padding:24px 16px 56px;
  }
  .wrap{max-width:560px;margin:0 auto}
  h1{font:800 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:0 0 6px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--train);box-shadow:0 0 12px var(--train)}
  .lead{color:var(--muted);font-size:13px;margin:0 0 18px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;font-weight:700}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;user-select:none;font-size:14px}
  .chip input{accent-color:var(--train);width:16px;height:16px}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
  .seg button.on{background:var(--warn);color:#11160f}

  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1 1 130px;min-width:120px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number]{width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px;font-size:16px;font-variant-numeric:tabular-nums}
  input:focus{outline:0;border-color:rgba(232,197,106,.36);box-shadow:0 0 0 3px rgba(232,197,106,.13)}
  .timewrap{display:flex;gap:8px}
  .agora{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:0 12px;cursor:pointer;font-size:12px;white-space:nowrap}
  .agora:hover{color:var(--ink);border-color:var(--train)}
  .hm{display:flex;gap:8px;align-items:center}.hm input{text-align:center}.hm span{color:var(--muted);font-size:13px}
  .cap{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .hide{display:none !important}

  .result{background:linear-gradient(170deg,rgba(232,197,106,.06),transparent 55%),var(--panel);border-color:rgba(232,197,106,.3)}
  .heads{display:flex;gap:12px;margin-bottom:12px}
  .big{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .big .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .big .v{font:800 24px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
  .big.hunt{border-color:rgba(224,167,106,.4)}.big.hunt .v{color:var(--hunt)}
  .big.train{border-color:rgba(111,220,140,.4)}.big.train .v{color:var(--train)}
  .bar{height:10px;border-radius:6px;background:var(--sunken);border:1px solid var(--line);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}.bar .h{background:var(--hunt)}.bar .t{background:var(--train)}
  .barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

  .roteiro{margin-top:18px}
  .rlabel{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
  .step{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:11px 13px;margin-bottom:8px}
  .step.hunt{border-left-color:var(--hunt)} .step.train{border-left-color:var(--train)} .step.night{border-left-color:var(--night)}
  .step .tm{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
  .step .mid{flex:1;min-width:0}
  .step .act{font-weight:600;font-size:14px}
  .step.hunt .act{color:var(--hunt)} .step.train .act{color:var(--train)} .step.night .act{color:var(--night)}
  .step .dur{font-size:12px;color:var(--muted)}
  .step .aft{text-align:right;white-space:nowrap}
  .step .aft .v{font-weight:700;font-variant-numeric:tabular-nums}
  .step .aft .dl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .tip{font-size:14px;margin-top:8px;padding:11px 13px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
  .tip.warn{background:rgba(232,197,106,.09);border-color:rgba(232,197,106,.32);color:#ffd9a8}
  .tip.bad{background:rgba(255,122,104,.09);border-color:rgba(255,122,104,.35);color:#ff9b8b}
  .tip b{color:var(--ink)}.tip.warn b,.tip.bad b{color:inherit}

  details{margin-top:2px}summary{cursor:pointer;color:var(--muted);font-size:13px}
  .info{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}
  .info code{color:var(--ink);background:var(--panel-2);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span> Stamina Calculator</h1>
  <p class="lead">Plan your day — when to hunt, when to train — so you can hunt overnight and wake up with stamina to spare.</p>

  <div class="card">
    <div class="toprow">
      <label class="chip"><input type="checkbox" id="vip" checked> VIP active</label>
      <div class="seg" id="seg"><button data-m="hm" class="on">h:min</button><button data-m="pct">%</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Where I am now</h2>
    <div class="row">
      <div class="col">
        <label>Right now it's <span style="opacity:.6"></span></label>
        <div class="timewrap"><input type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" id="tNow"><button class="agora" id="btnNow">now</button></div>
      </div>
      <div class="col">
        <label>Stamina I have</label>
        <div class="grp-hm hm"><input type="number" id="hNow" min="0" max="42" value="23"><span>h</span><input type="number" id="mNow" min="0" max="59" value="0"><span>min</span></div>
        <div class="grp-pct hide"><input type="number" id="pctNow" min="0" max="100" value="55"></div>
        <div class="cap" id="capNow"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Overnight goal</h2>
    <div class="row">
      <div class="col"><label>Sleep / start the hunt at <span style="opacity:.6">(24h)</span></label><input type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" id="tSleep" value="22:00"></div>
      <div class="col"><label>Wake up at <span style="opacity:.6">(24h)</span></label><input type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="HH:MM" id="tWake" value="09:00"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="col">
        <label>Want to wake up with</label>
        <div class="grp-hm hm"><input type="number" id="hWake" min="0" max="42" value="14"><span>h</span><input type="number" id="mWake" min="0" max="59" value="0"><span>min</span></div>
        <div class="grp-pct hide"><input type="number" id="pctWake" min="0" max="100" value="33"></div>
        <div class="cap" id="capWake"></div>
      </div>
    </div>
  </div>

  <div class="card result" id="out"></div>

  <div class="card"><details><summary>How the math works</summary><div class="info" id="info"></div></details></div>
</div>

<script>
const MAX=2520, PEN=Math.round(MAX*0.15);   // 42h ; 15% = 378min (6h18)
const $=id=>document.getElementById(id);
let mode='hm';

const fmt=m=>{m=Math.round(m);if(m<=0)return'0min';const h=Math.floor(m/60),x=m%60;return h&&x?`${h}h ${x}min`:h?`${h}h`:`${x}min`;};
const clock=t=>{t=((t%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.round(t%60)).padStart(2,'0');};
// aceita "HH:MM", "H:MM" ou só dígitos "HHMM"/"HMM"; clampa em 24h. vazio/invalido -> null.
const ptime=v=>{
  if(v==null) return null; v=String(v).trim(); if(!v) return null;
  let h,m;
  if(v.includes(':')){ const p=v.split(':'); h=parseInt(p[0],10); m=parseInt(p[1],10); }
  else { const d=v.replace(/\D/g,''); if(!d) return null;
    if(d.length<=2){ h=parseInt(d,10); m=0; } else { h=parseInt(d.slice(0,d.length-2),10); m=parseInt(d.slice(-2),10); } }
  if(!Number.isFinite(h)) return null; if(!Number.isFinite(m)) m=0;
  h=Math.max(0,Math.min(23,h)); m=Math.max(0,Math.min(59,m));
  return h*60+m;
};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=m=>Math.round(m/MAX*100);

function readS(w){
  if(mode==='pct')return cl(+$('pct'+w).value||0,0,100)/100*MAX;
  return Math.min(MAX,cl(+$('h'+w).value||0,0,42)*60+cl(+$('m'+w).value||0,0,59));
}
const rate=()=>$('vip').checked?8:4;

function setMode(nm){
  if(nm===mode)return;
  ['Now','Wake'].forEach(w=>{const min=readS(w);
    if(nm==='pct')$('pct'+w).value=pct(min);
    else{$('h'+w).value=Math.floor(min/60);$('m'+w).value=Math.round(min%60);}});
  mode=nm;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===nm));
  document.querySelectorAll('.grp-pct').forEach(e=>e.classList.toggle('hide',nm!=='pct'));
  document.querySelectorAll('.grp-hm').forEach(e=>e.classList.toggle('hide',nm!=='hm'));
  calc();
}

function step(cls,act,start,end,dur,delta,after){
  const sign=delta>=0?'+':'−';
  return `<div class="step ${cls}">
    <div class="tm">${clock(start)}<br><span style="font-weight:400;color:var(--muted);font-size:12px">${clock(end)}</span></div>
    <div class="mid"><div class="act">${act}</div><div class="dur">${fmt(dur)}</div></div>
    <div class="aft"><div class="v">${fmt(after)}</div><div class="dl">${sign}${fmt(Math.abs(delta))} · ${pct(after)}%</div></div>
  </div>`;
}

function calc(){
  const r=rate();
  const now=ptime($('tNow').value), sleep=ptime($('tSleep').value), wake=ptime($('tWake').value);
  const S0=readS('Now'), morning=readS('Wake');
  $('capNow').textContent = mode==='pct'?`= ${fmt(S0)}`:`= ${pct(S0)}%`;
  $('capWake').textContent= mode==='pct'?`= ${fmt(morning)}`:`= ${pct(morning)}%`;
  info(r);

  const out=$('out');
  if(now===null||sleep===null||wake===null){out.innerHTML=`<div class="tip warn">Fill in the times.</div>`;return;}

  let win=sleep-now; if(win<=0)win+=1440;
  let night=wake-sleep; if(night<=0)night+=1440;

  let need=morning+night, capped=false;
  if(need>MAX){capped=true;need=MAX;}

  const minR=Math.max(0,S0-win), maxR=Math.min(MAX,S0+win*r);
  let T,H,arrival,tip='',tipCls='';

  if(need>maxR+0.5){ T=win;H=0;arrival=maxR;
    tip=`Not enough time to recover it all. Even <b>training all day</b> you reach ${fmt(arrival)} and wake up with <b>${fmt(Math.max(0,arrival-night))}</b>. Start earlier or lower the goal.`;tipCls='bad';
  }else if(need<minR-0.5){ T=0;H=win;arrival=minR;
    tip=`Stamina to spare: you can <b>hunt all day</b> and still wake up with <b>${fmt(Math.max(0,arrival-night))}</b>.`;
  }else{ T=cl((need-S0+win)/(1+r),0,win);H=win-T;arrival=S0-H+T*r;
    const trough=S0-H, peak=arrival+H;
    if(trough>=PEN) tip=`Hunting pays off all day up to here: your lowest point is ${fmt(trough)}, still above 15%.`;
    else if(peak<=MAX){tip=`Train first so you don't hunt below 15% (otherwise XP and gold are halved).`;tipCls='warn';}
    else {tip=`A stretch will drop below 15% (gains ×0.5) — unavoidable in this window.`;tipCls='warn';}
  }

  // sequence of the day's blocks
  let seq=[];
  if(H>0.5&&T>0.5){
    const trough=S0-H, peak=arrival+H;
    seq = (trough>=PEN || peak>MAX) ? [['hunt',H],['train',T]] : [['train',T],['hunt',H]];
  } else if(T>0.5) seq=[['train',T]];
  else if(H>0.5) seq=[['hunt',H]];

  // build the plan
  let cur=S0, tc=now, rows='';
  for(const [type,dur] of seq){
    const end=tc+dur, delta=type==='hunt'?-dur:dur*r;
    cur=Math.min(MAX,Math.max(0,cur+delta));
    rows+=step(type, type==='hunt'?'Hunt':'Train (online)', tc, end, dur, delta, cur);
    tc=end;
  }
  const morningReal=Math.max(0,cur-night);
  if(night>0) rows+=step('night','Overnight hunt (online)', sleep, wake, night, -night, morningReal);

  const pH=win>0?Math.round(H/win*100):0;
  let html=`<h2>Summary until ${clock(sleep)}</h2>
    <div class="heads">
      <div class="big hunt"><div class="k">Hunt (total)</div><div class="v">${fmt(H)}</div></div>
      <div class="big train"><div class="k">Train (total)</div><div class="v">${fmt(T)}</div></div></div>
    <div class="bar"><i class="h" style="width:${pH}%"></i><i class="t" style="width:${100-pH}%"></i></div>
    <div class="barlbl"><span>hunt ${pH}%</span><span>train ${100-pH}%</span></div>
    <div class="roteiro"><div class="rlabel">Plan</div>${rows}</div>`;

  if(capped) html+=`<div class="tip warn">To hunt ${fmt(night)} and wake up with ${fmt(morning)} you'd need ${fmt(morning+night)} at ${clock(sleep)} — over the 42h cap. With a full tank, you wake up with <b>${fmt(MAX-night)}</b>.</div>`;
  if(morningReal<PEN && !capped) html+=`<div class="tip warn">You wake up below 15%: part of the night pays half.</div>`;
  html+=`<div class="tip ${tipCls}">${tip}</div>`;

  out.innerHTML=html;
}

function info(r){
  $('info').innerHTML=
    `Stamina: <code>0</code> to <code>42h</code> (the % is of that).<br>`+
    `Hunting spends <code>1×</code>. <b>Online</b> training recovers <code>${r}×</code> ${$('vip').checked?'(VIP)':'(no VIP; 4×)'} — i.e. 1h of training gives back ${fmt(r*60)}. <b>Offline</b> training is half.<br>`+
    `Below <code>15%</code> (${fmt(PEN)}) XP and gold are halved; drop is unchanged.<br>`+
    `Overnight the party hunts <b>online</b> and spends 1×/min. In <b>offline Hunt</b>, stamina isn't spent — so no buffer needed.`;
}

$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);});
['vip','tNow','tSleep','tWake','hNow','mNow','pctNow','hWake','mWake','pctWake'].forEach(id=>{$(id).addEventListener('input',calc);$(id).addEventListener('change',calc);});
// ao sair do campo de hora, reformata pra HH:MM 24h (ou limpa se invalido)
['tNow','tSleep','tWake'].forEach(id=>$(id).addEventListener('blur',()=>{const t=ptime($(id).value);$(id).value=(t==null)?'':clock(t);calc();}));
$('btnNow').addEventListener('click',()=>{const d=new Date();$('tNow').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');calc();});
(function(){const d=new Date();$('tNow').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');calc();})();
</script>
</body>
</html>
